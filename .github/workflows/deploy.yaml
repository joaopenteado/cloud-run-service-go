name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  SERVICE_NAME: cloud-run-service-go
  REGION: us-central1

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup ko
        uses: ko-build/setup-ko@v0.6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with ko
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: |
          IMAGE=$(ko build --bare --tags=${{ github.sha }},latest .)
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "Built and pushed image: ${IMAGE}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars=SERVICE_NAME=${{ env.SERVICE_NAME }},ENVIRONMENT=production,LOG_LEVEL=info
